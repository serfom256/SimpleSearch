server:
    servlet.contextPath: /simplesearch
    port: 8050
spring:
    main.banner-mode: off
    datasource:
        url: 'jdbc:postgresql://localhost:5432/simplesearch'
        username: 'user'
        password: '0000' 
    liquibase:
        change-log: classpath:db/changelog/master.xml

simplesearch:
    restore.data: true

spring.servlet.multipart.max-file-size: 100MB
spring.servlet.multipart.max-request-size: 100MB